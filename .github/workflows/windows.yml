name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build

      - name: Build program
        run: cmake --build build --config Release

      - name: Test startup on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          "3" | .\build\Release\RestaurantSystem.exe

      - name: Test startup on Linux and macOS
        if: matrix.os != 'windows-latest'
        run: |
          echo "3" | ./build/RestaurantSystem

      - name: Save program on Windows
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantSystem-Windows
          path: build/Release/RestaurantSystem.exe

      - name: Save program on Linux and macOS
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantSystem-${{ matrix.os }}
          path: build/RestaurantSystem